    <!-- ✅ Service Worker Registration con error handling -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker-1.0.js', { scope: '/' })
                    .then(registration => {
                        console.log('✅ Service Worker registrato con successo:', registration.scope);

                        // Check immediato per aggiornamenti
                        registration.update();

                        // Check for updates ogni 60 secondi
                        setInterval(() => {
                            registration.update();
                        }, 60000);

                        // Listen per aggiornamenti
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('🔄 Nuova versione Service Worker disponibile. Ricarica la pagina.');

                                    // Force reload automatico per applicare fix audio/video
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                    window.location.reload();
                                }
                            });
                        });

                        // Listen per il controller change (nuovo SW attivo)
                        navigator.serviceWorker.addEventListener('controllerchange', () => {
                            console.log('🔄 Service Worker aggiornato, ricarico la pagina...');
                            window.location.reload();
                        });
                    })
                    .catch(error => {
                        console.error('❌ Errore registrazione Service Worker:', error);
                    });
            });
        } else {
            console.warn('⚠️ Service Worker non supportato da questo browser');
        }
    </script>

    function ShowModal(modalId) {
       
        $('#' + modalId).modal('show');
    }
    function CloseModal(modalId) {
        $('#' + modalId).modal('hide');
    }

    function setTooltip() {
       
        $('[data-bs-toggle="tooltip"]').tooltip();

       
    }

    function CollapseDiv(divId, status) {

        $('#' + divId).collapse('toggle');
        if (status)
            $('#' + divId).collapse('show');
        else
            $('#' + divId).collapse('hide');
    }

</script>
