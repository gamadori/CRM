    <script>
        (() => {
            const savedTheme = localStorage.getItem('crm-color-scheme');
            const isDark = savedTheme === 'dark' ||
                (savedTheme === null && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
            document.documentElement.dataset.bsTheme = isDark ? 'dark' : 'light';
            document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
            document.body.classList.toggle('dark-theme', isDark);
        })();
    </script>

    <!-- ✅ Service Worker Registration con error handling -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker-1.0.js', { scope: '/', updateViaCache: 'none' })
                    .then(registration => {
                        console.log('✅ Service Worker registrato con successo:', registration.scope);

                        // Check immediato per aggiornamenti
                        registration.update();

                        // Check for updates ogni 60 secondi
                        setInterval(() => {
                            registration.update();
                        }, 60000);

                        // Attiva il nuovo worker senza ricaricare la pagina corrente.
                        // Un reload automatico durante la callback OIDC consumerebbe
                        // due volte lo state della richiesta e farebbe fallire il login.
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('🔄 Nuova versione Service Worker disponibile.');
                                    newWorker.postMessage({ type: 'SKIP_WAITING' });
                                }
                            });
                        });

                        // Il nuovo worker controllerà le richieste successive. La pagina
                        // sarà aggiornata alla prossima navigazione o al prossimo reload.
                        navigator.serviceWorker.addEventListener('controllerchange', () => {
                            console.log('🔄 Service Worker aggiornato.');
                        });
                    })
                    .catch(error => {
                        console.error('❌ Errore registrazione Service Worker:', error);
                    });
            });
        } else {
            console.warn('⚠️ Service Worker non supportato da questo browser');
        }
    </script>

    function ShowModal(modalId) {
       
        $('#' + modalId).modal('show');
    }
    function CloseModal(modalId) {
        $('#' + modalId).modal('hide');
    }

    function setTooltip() {
       
        $('[data-bs-toggle="tooltip"]').tooltip();

       
    }

    function CollapseDiv(divId, status) {

        $('#' + divId).collapse('toggle');
        if (status)
            $('#' + divId).collapse('show');
        else
            $('#' + divId).collapse('hide');
    }

</script>
