<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="30">
    <title>CRM - Manutenzione</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #263238;
            background: #f4f6f8;
        }
        main {
            width: min(620px, 100%);
            padding: 42px;
            text-align: center;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 10px 35px #0002;
        }
        .icon { font-size: 52px; }
        h1 { margin: 12px 0; }
        p { line-height: 1.6; }
    </style>
</head>
<body>
<main>
    <div class="icon">🛠️</div>
    <h1>Manutenzione in corso</h1>
    <p>Il CRM è temporaneamente indisponibile per un aggiornamento.</p>
    <p>La pagina verrà aggiornata automaticamente. Riprova tra qualche minuto.</p>
</main>
</body>
</html>
